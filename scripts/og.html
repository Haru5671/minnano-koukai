<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.c{width:1200px;height:630px;background:radial-gradient(120% 140% at 80% 0%,#1c140a 0%,#0a0806 60%);
   font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;color:#f0e6d2;position:relative;
   display:flex;flex-direction:column;justify-content:center;padding:84px 92px}
.eyebrow{font-size:24px;font-weight:600;letter-spacing:.32em;color:#d4a548;margin-bottom:34px;display:flex;align-items:center;gap:16px;font-family:Georgia,serif}
.line{width:48px;height:1px;background:#d4a548;opacity:.7}
h1{font-size:104px;font-weight:500;line-height:1.08;letter-spacing:.02em;margin-bottom:34px}
.sub{font-size:32px;font-weight:400;color:#cabfa8;line-height:1.6}
.sub b{color:#f0e6d2;font-weight:500;border-bottom:1px solid #d4a548;padding-bottom:3px}
.foot{position:absolute;left:92px;bottom:62px;font-size:23px;color:#8a7e6e;font-family:Georgia,serif;letter-spacing:.05em}
.badge{position:absolute;right:92px;bottom:56px;border:1px solid rgba(212,165,72,.4);border-radius:9999px;padding:13px 28px;font-size:23px;font-weight:500;color:#d4a548}
.glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(212,165,72,.22),transparent 65%);right:-120px;top:-150px}
</style></head><body>
<div class="c">
  <div class="glow"></div>
  <div class="eyebrow"><span class="line"></span>ANONYMOUS &amp; SAFE</div>
  <h1>みんなの後悔</h1>
  <div class="sub">あなたの後悔、聞かせてください。<br><b>匿名で共有</b>し、<b>AIが解決策</b>を提案する後悔データベース。</div>
  <div class="foot">ko-kai.jp</div>
  <div class="badge">248件の後悔 × AI</div>
</div>
