<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
.c{width:1200px;height:630px;background:linear-gradient(135deg,#0a3d1f 0%,#006e2b 55%,#06c755 130%);
   font-family:'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;color:#fff;position:relative;
   display:flex;flex-direction:column;justify-content:center;padding:84px 88px}
.eyebrow{font-size:25px;font-weight:700;letter-spacing:.18em;color:#bff5d4;margin-bottom:30px;display:flex;align-items:center;gap:14px}
.dot{width:13px;height:13px;border-radius:50%;background:#06c755;box-shadow:0 0 0 6px rgba(6,199,85,.28)}
h1{font-size:96px;font-weight:900;line-height:1.1;letter-spacing:-.02em;margin-bottom:30px}
.sub{font-size:33px;font-weight:600;color:#e9fff1;line-height:1.5}
.sub b{color:#fff;border-bottom:3px solid #06c755;padding-bottom:2px}
.foot{position:absolute;left:88px;bottom:64px;font-size:24px;color:#bff5d4;font-weight:600}
.badge{position:absolute;right:88px;bottom:60px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
   border-radius:9999px;padding:14px 30px;font-size:25px;font-weight:800;color:#fff;backdrop-filter:blur(6px)}
.glow{position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(6,199,85,.45),transparent 65%);right:-120px;top:-160px}
</style></head><body>
<div class="c">
  <div class="glow"></div>
  <div class="eyebrow"><span class="dot"></span>SAFE &amp; ANONYMOUS</div>
  <h1>みんなの後悔</h1>
  <div class="sub">後悔しない人生のために。<br>あなたの後悔を<b>匿名で共有</b>、<b>AIが解決策</b>を提案。</div>
  <div class="foot">ko-kai.jp</div>
  <div class="badge">248件の後悔データ × AI</div>
</div>
</body></html>
